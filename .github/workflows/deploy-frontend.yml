name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          VITE_API_BASE_URL: https://taskmentor.isengesho.com
          VITE_SOCKET_URL: https://taskmentor.liveserver.isengesho.com
          VITE_SSO_CLIENT_ID: taskmentor_app
          VITE_MIS_LOGIN_URL: https://nga.ac.rw/mis/login

      - name: Deploy frontend files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FRONTEND_FTP_SERVER }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./client/dist/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
