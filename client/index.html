<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Primary Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <!-- Apple Touch Icon for iOS -->
    <link rel="apple-touch-icon" href="/favicon-180x180.png" />
    <!-- Theme Color -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskMentor - Assessments, Quizzes, Exams, and Report cards</title>
    <!-- Typography: Inter (UI) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400;1,14..32,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="TaskMentor is an AI-powered platform that helps students and educators create assessments, quizzes, exams, and report cards. With TaskMentor, you can easily generate personalized assessments based on your curriculum and track student progress with detailed report cards."
    />
    <script>
      // Redirect /public/taskmentor/* to /taskmentor/* before React loads
      (function () {
        var path = window.location.pathname;
        if (path.includes("/public/taskmentor/")) {
          var newPath = path.replace("/public/taskmentor", "/taskmentor/");
          window.location.replace(newPath);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
