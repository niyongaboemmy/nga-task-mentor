# nga-task-mentor — nginx server blocks
# Copy to /etc/nginx/sites-available/taskmentor.conf then:
#   sudo ln -s /etc/nginx/sites-available/taskmentor.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to fill in the SSL directives automatically:
#   sudo certbot --nginx -d taskmentor.amashuri.com -d taskmentor-api.amashuri.com -d live.amashuri.com

# Frontend (static build)
server {
    listen 80;
    server_name taskmentor.amashuri.com;

    root /opt/apps/nga-task-mentor/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# Backend API
server {
    listen 80;
    server_name taskmentor-api.amashuri.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default 4-8k buffer is too small for this API's response headers
        # (large Set-Cookie/token payload on SSO and auth routes) -- nginx
        # was truncating them and returning 502 "upstream sent too big
        # header" instead of proxying. Same fix as api.amashuri.com.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }
}

# Live server (Socket.IO / WebRTC signaling) — needs Upgrade headers
server {
    listen 80;
    server_name live.amashuri.com;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # keep long-lived websocket connections open
    }
}
